<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Zotob - 300 threads</title>
<link rel="stylesheet" href="assets/w2k.css">
<style>
 .stage{background:#101418;font-family:Arial,Helvetica,sans-serif;color:#d9dde2}
 canvas{position:absolute;left:0;top:0}
 #cap{position:absolute;left:60px;top:28px;font-size:28px;color:#fff}
 #cap small{display:block;font-size:19px;color:#8f99a5;margin-top:8px}
 .clean #cap{display:none}
 #cnt{position:absolute;left:60px;top:370px;font:18px/28px "Lucida Console",monospace;color:#8f99a5}
 #cnt b{color:#fff;font-weight:normal}
</style></head><body>
<div class="stage" data-w="1280" data-h="720" style="width:1280px;height:720px">
 <canvas id="c" width="1280" height="720"></canvas>
 <div id="cap">300 threads, all at the same time<small>It keeps the first two numbers of its own address and guesses the last two.</small></div>
 <div id="cnt">threads   <b>300</b><br>port      <b>TCP 445</b><br>tried     <b id="tr">0</b><br>infected  <b id="inf">0</b></div>
 <div class="recon" style="left:60px;top:680px">Illustration. Target addresses drawn from a documentation range (203.0.113.x); the real worm picked from its own /16.</div>
</div>
<script src="assets/icons.js"></script><script src="assets/sim.js"></script>
<script>
var c=$('#c'),g=c.getContext('2d');
var src={x:250,y:300};
var cols=14,rows=8,T=[];
for(var r=0;r<rows;r++)for(var k=0;k<cols;k++){
  var i=r*cols+k,o=(i*97+31)%254+1;
  T.push({x:560+k*49,y:140+r*42,ip:'203.0.113.'+o,s:0,vuln:[17,40,58,83,101,119].indexOf(i)>=0});
}
var shots=[],tried=0,inf=0,running=false,speed=1;
function draw(){
  g.clearRect(0,0,1280,720);
  // source machine
  g.fillStyle='#c94b3a';g.fillRect(src.x-60,src.y-45,120,80);g.fillStyle='#000';g.fillRect(src.x-50,src.y-37,100,62);
  g.fillStyle='#b3ad9f';g.fillRect(src.x-20,src.y+35,40,12);g.fillRect(src.x-45,src.y+47,90,5);
  g.fillStyle='#fff';g.font='12px Lucida Console';g.fillText('botzor.exe',src.x-38,src.y-12);
  g.fillStyle='#e86a58';g.font='bold 16px Arial';g.fillText('203.0.113.17',src.x-50,src.y+75);
  shots.forEach(function(s){
    var t=T[s.t],p=Math.min(1,s.p);
    g.strokeStyle=s.hit?'rgba(232,106,88,.9)':'rgba(232,185,49,.35)';g.lineWidth=1;
    g.beginPath();g.moveTo(src.x+60,src.y);g.lineTo(src.x+60+(t.x-src.x-60)*p,src.y+(t.y-src.y)*p);g.stroke();
  });
  T.forEach(function(t){
    g.fillStyle=t.s===2?'#c94b3a':(t.s===1?'#2a3139':'#1b2026');
    g.fillRect(t.x-20,t.y-14,40,26);
    g.strokeStyle=t.s===2?'#e86a58':'#39424d';g.strokeRect(t.x-20.5,t.y-14.5,41,27);
    g.fillStyle=t.s===2?'#fff':'#56616e';g.font='9px Lucida Console';g.fillText(t.ip.split('.')[3],t.x-8,t.y+3);
  });
}
function tick(){
  if(!running)return;
  for(var n=0;n<3*speed;n++){var t=(Math.random()*T.length)|0;if(T[t].s===0||Math.random()<.2)shots.push({t:t,p:0});}
  shots.forEach(function(s){s.p+=0.06;if(s.p>=1&&!s.done){s.done=1;tried++;var t=T[s.t];
    if(t.vuln&&t.s!==2){t.s=2;inf++;s.hit=1;}else if(t.s===0)t.s=1;}});
  shots=shots.filter(function(s){return s.p<1.6;});
  $('#tr').textContent=tried;$('#inf').textContent=inf;
  draw();requestAnimationFrame(tick);
}
draw();
scene([
 function(f){running=true;tick();},
 function(f){speed=4;}
]);
</script></body></html>
