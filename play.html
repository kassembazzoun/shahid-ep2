<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Play - Episode 2</title>
<style>
 html,body{margin:0;height:100%;background:#000;overflow:hidden;font:14px Arial,Helvetica,sans-serif;color:#ddd}
 iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
 #start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#111;z-index:10}
 #start .box{width:520px;line-height:1.5}
 #start h1{font-size:20px;margin:0 0 4px;color:#fff}
 #start p{margin:6px 0;color:#aaa}
 #start label{display:block;margin:8px 0}
 #start button{margin-top:14px;font:15px Arial;padding:8px 28px;background:#ddd;border:1px solid #999;cursor:pointer}
 #hud{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.75);color:#fff;padding:6px 10px;font:13px Arial;z-index:9;display:none}
 #end{position:absolute;inset:0;background:#000;display:none;align-items:center;justify-content:center;color:#777;z-index:8}
 #veil{position:absolute;inset:0;background:#000;z-index:7;opacity:0;transition:opacity .35s;pointer-events:none}
 body.rec,body.rec *{cursor:none}
</style></head><body>
<iframe id="f" title="scene"></iframe>
<div id="veil"></div>
<div id="hud"></div>
<div id="end">End of episode. Press B to go back a scene, or Esc to leave full screen.</div>
<div id="start"><div class="box">
 <h1 id="ttl"></h1>
 <p>Plays every scene in order, step by step, full screen. Record the screen once.</p>
 <label>Pace: <select id="pace"><option value="3500">Slow</option><option value="2500" selected>Normal</option><option value="1600">Fast</option></select></label>
 <label><input type="checkbox" id="clean" checked> Clean (no SIMULATION badge, no source tags, no mouse pointer)</label>
 <label>Start at scene: <select id="from"></select></label>
 <p>While playing: Space pause / resume, Right arrow next step now, N / B next / previous scene, H show scene name.</p>
 <button id="go">Start</button>
</div></div>
<script>
var EP="Episode 2 - Zotob / Diabl0";
var SCENES=[{"f": "a1-exploit.html"}, {"f": "a2-strings.html"}, {"f": "a3-irc.html"}, {"f": "a4-chat.html"}, {"f": "a5-infection.html"}, {"f": "a6-scan.html", "hold": 6000}, {"f": "b1-desktop.html", "hold": 3500}, {"f": "b2-taskmgr.html"}, {"f": "b3-hosts.html"}, {"f": "b4-shutdown.html", "extra": "from=12", "hold": 6000}, {"f": "b5-newsroom.html", "hold": 12000}, {"f": "c1-lookup.html"}, {"f": "c2-clues.html"}, {"f": "c3-verdict.html"}, {"f": "d1-email.html"}, {"f": "d2-3dsecure.html"}, {"f": "d3-funnel.html"}];
var f=document.getElementById('f'),hud=document.getElementById('hud'),veil=document.getElementById('veil'),cur=-1,ms=2500,clean=true,paused=false,ht=null;
document.getElementById('ttl').textContent=EP;
var sel=document.getElementById('from');SCENES.forEach(function(s,i){var o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+s.f.replace('.html','');sel.appendChild(o);});
function showHud(){hud.textContent='Scene '+(cur+1)+' / '+SCENES.length+'   '+SCENES[cur].f.replace('.html','')+(paused?'   (paused)':'');hud.style.display='block';clearTimeout(ht);ht=setTimeout(function(){if(!paused)hud.style.display='none';},2500);}
function load(i){
  if(i<0)i=0;
  if(i>=SCENES.length){document.getElementById('end').style.display='flex';cur=SCENES.length;return;}
  document.getElementById('end').style.display='none';
  cur=i;paused=false;var s=SCENES[i];
  veil.style.opacity=1;
  setTimeout(function(){
    f.src=s.f+'?auto='+ms+(clean?'&clean=1&nocursor=1':'')+(s.extra?'&'+s.extra:'')+'&hold='+(s.hold||Math.round(ms*1.4));
    f.onload=function(){veil.style.opacity=0;try{f.contentWindow.focus();}catch(e){}};
  },350);
}
function key(k){
  if(cur<0)return;
  if(k===' '){paused=!paused;f.contentWindow.postMessage({sim:'pause',on:paused},'*');showHud();}
  else if(k==='ArrowRight'){f.contentWindow.postMessage({sim:'next'},'*');}
  else if(k==='n'||k==='N'){load(cur+1);}
  else if(k==='b'||k==='B'){load(Math.min(cur,SCENES.length)-1);}
  else if(k==='h'||k==='H'){if(cur<SCENES.length)showHud();}
}
addEventListener('message',function(e){var d=e.data||{};if(d.sim==='done')load(cur+1);else if(d.sim==='key')key(d.key);});
addEventListener('keydown',function(e){if(document.getElementById('start').style.display==='none'){e.preventDefault();key(e.key);}});
document.getElementById('go').onclick=function(){
  ms=+document.getElementById('pace').value;clean=document.getElementById('clean').checked;
  if(clean)document.body.classList.add('rec');
  document.getElementById('start').style.display='none';
  var el=document.documentElement;if(el.requestFullscreen)el.requestFullscreen().catch(function(){});
  load(+sel.value);
};
</script></body></html>
