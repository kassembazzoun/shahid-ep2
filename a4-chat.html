<script>
// d = DiablO (arrives whole), t = the researcher (typed in the input line, then sent)
var X=[
 ['d','wht u think about this new worm? :o'],
 ['t',"it is pretty good...the variables using the domain from email and then adding the 'www' in front is good. i would imagine you will get a lot of bots"],
 ['d','soon adding logo of domaine :p'],
 ['t','really? how are you going to do that?'],
 ['d','yes'],
 ['t','that would be interesting...just curious how you could do that...would be hard'],
 ['d','i got more than 200 complaints in last dedicated server :p. i guess u too sent complaints'],
 ['t','they are probably not going to send you any christmas presents. it is hard work cleaning up after getting infected with a worm like this. it costs money'],
 ['d','no very easy. that worm spread only for money'],

 ['d','no'],

var log=$('#log'),typed=$('#typed'),timer=null,pending=null;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function post(x){
  var d=document.createElement('div');
  d.className=x[0]==='d'?'in':'out';
  d.innerHTML=(x[0]==='d'?'<span class="n">[DiablO(DiablO@elite)]</span> ':'<span class="n">[msg(DiablO)]</span> ')+'<span class="t">'+esc(x[1])+'</span>';
  log.appendChild(d);
}
// Finish whatever is still being typed, so two lines can never run at the same time.
function finish(){if(pending){clearTimeout(timer);var x=pending;pending=null;typed.textContent='';post(x);}}
function say(i,fast){
  finish();
  var x=X[i];
  if(x[0]==='d'||fast){post(x);return;}
  pending=x;var k=0;
  (function t(){
    if(pending!==x)return;
    if(k<x[1].length){typed.textContent+=x[1].charAt(k++);timer=setTimeout(t,22);}
    else timer=setTimeout(function(){if(pending===x){pending=null;typed.textContent='';post(x);}},450);
  })();
}
scene(X.map(function(_,i){return function(f){say(i,f);};}));
